services:
  - type: web
    name: civilization-origins
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Online/Server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civilization-origins-db
          property: connectionString
databases:
  - name: civilization-origins-db
    plan: free
    region: frankfurt
